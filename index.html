<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DTok — Olympus Storm Exact Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#02050b;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}
html,body{width:100%;height:100%;overflow:hidden}
body{min-height:100dvh;display:block}
.stage{
  position:fixed;inset:0;
  width:100vw;height:100dvh;
  background:#050914 url("dtok-olympus-storm.png") center/100% 100% no-repeat;
  overflow:hidden;
  user-select:none;
}
.overlay{position:absolute;pointer-events:none}
.reel-area{
  left:29.3%;top:22.2%;width:49.7%;height:43.0%;
  display:grid;grid-template-columns:repeat(5,1fr);gap:.3%;
  pointer-events:auto;overflow:hidden;
  padding:.35% .45%;
  border-radius:1.2%;
}
.reel{
  position:relative;overflow:hidden;border-radius:1%;
  background:linear-gradient(180deg,#07101eea,#02050be8);
  box-shadow:inset 0 0 25px #000,0 0 8px #0009;
}
.strip{
  position:absolute;left:0;right:0;top:0;
  display:flex;flex-direction:column;
  will-change:transform;
}
.sym{
  flex:0 0 33.3333%;min-height:33.3333%;
  display:grid;place-items:center;
  margin:.8%;border-radius:8%;
  background:linear-gradient(145deg,#eef3ff,#aab6cb 54%,#5b6679);
  border:2px solid #edf2ff;color:#10172a;
  font-size:clamp(20px,3.1vw,48px);
  font-weight:900;
  box-shadow:inset 0 -12px 15px #0003,0 4px 9px #0009;
}
.sym.wild{background:linear-gradient(145deg,#ffe47a,#9c5b0b);border-color:#fff0a9}
.sym.scatter{background:linear-gradient(145deg,#a86cff,#3c1598);color:white;border-color:#dcc7ff}
.reel.rolling .sym{filter:blur(1.6px)}
.reel.win .sym{animation:win .42s infinite alternate}
@keyframes win{to{transform:scale(1.07);filter:brightness(1.35);box-shadow:0 0 25px #ffd65a,inset 0 -12px 15px #0003}}
.payline{position:absolute;left:29.3%;top:43.1%;width:49.7%;height:.28%;background:#ff2d59;box-shadow:0 0 18px #ff2d59;z-index:5;pointer-events:none}
.spin{
  position:absolute;left:49.2%;top:68.2%;width:7.0%;height:9.0%;
  border-radius:50%;border:0;background:transparent;
  cursor:pointer;pointer-events:auto;
}
.spin:active{transform:scale(.94)}
.win{
  position:absolute;left:45%;top:42%;width:20%;text-align:center;
  font-weight:1000;opacity:0;pointer-events:none;
  text-shadow:0 3px 0 #754300,0 0 28px #ffd45a;
}
.win strong{display:block;font-size:clamp(30px,5vw,72px);color:#ffe16b}
.win.show{animation:pop 1.25s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.45)}20%,75%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.18)}}
.betminus{position:absolute;left:23.0%;top:70.9%;width:2.8%;height:5%;pointer-events:auto;cursor:pointer}
.betplus{position:absolute;left:31.0%;top:70.9%;width:2.8%;height:5%;pointer-events:auto;cursor:pointer}
.autoplay{position:absolute;left:62.6%;top:70.7%;width:11.2%;height:6%;pointer-events:auto;cursor:pointer;border:0;background:transparent}
.result{
  position:absolute;left:76.1%;top:70.4%;width:9%;height:7%;display:grid;place-items:center;
  color:#ffd94f;font-weight:900;font-size:clamp(12px,1.5vw,23px);pointer-events:none
}
.balance{
  position:absolute;left:88.0%;top:70.4%;width:10%;height:7%;display:grid;place-items:center;
  color:#ffd94f;font-weight:900;font-size:clamp(12px,1.5vw,23px);pointer-events:none
}
.status{position:absolute;left:2%;bottom:1.3%;color:#8e9db8;font-size:10px;opacity:.8}

/* Телефон: перестраиваем игровую область вместо сжатия desktop-макета */
@media (max-width:700px){
  .stage{
    background-size:100% 100%;
    background-position:center;
  }
  .reel-area{
    left:4%;top:18%;width:92%;height:43%;
    gap:1.1%;padding:.8% 1%;
    border-radius:2.5%;
  }
  .reel{border-radius:2%;box-shadow:inset 0 0 16px #000,0 0 6px #0009}
  .sym{
    margin:1.2%;
    border-radius:10%;
    border-width:1px;
    font-size:clamp(18px,7vw,34px);
    box-shadow:inset 0 -7px 9px #0003,0 2px 5px #0009;
  }
  .payline{
    left:4%;top:39.4%;width:92%;height:.55%;
    box-shadow:0 0 12px #ff2d59;
  }
  .spin{
    left:42%;top:64%;width:16%;height:11%;
  }
  .betminus{
    left:8%;top:66%;width:11%;height:8%;
  }
  .betplus{
    left:22%;top:66%;width:11%;height:8%;
  }
  .autoplay{
    left:61%;top:66%;width:18%;height:8%;
  }
  .result{
    left:80%;top:65.5%;width:18%;height:8%;
    font-size:clamp(13px,4vw,21px);
  }
  .balance{
    left:40%;top:77%;width:20%;height:7%;
    font-size:clamp(14px,4.2vw,22px);
  }
  .win{
    left:10%;top:36%;width:80%;
  }
  .win strong{font-size:clamp(34px,10vw,58px)}
  .win span{font-size:clamp(10px,3.2vw,15px)}
  .status{
    left:0;right:0;bottom:.8%;
    text-align:center;font-size:7px;
  }
}
@media (max-width:380px){
  .reel-area{top:17%;height:42%}
  .sym{font-size:clamp(15px,6.8vw,29px)}
  .spin{top:63%;height:10%}
  .betminus,.betplus,.autoplay{top:65%;height:7%}
  .result{top:64.5%;height:7%}
  .balance{top:75%;height:7%}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="reel-area" id="reelArea"></div>
  <div class="payline"></div>
  <button class="spin" aria-label="Spin"></button>
  <button class="betminus" aria-label="Минус"></button>
  <button class="betplus" aria-label="Плюс"></button>
  <button class="autoplay" aria-label="Автоигра"></button>
  <div class="result" id="result">1 250</div>
  <div class="balance" id="balance">8 750</div>
  <div class="win" id="win"><strong>+1 250</strong><span>WIN • DEMO COINS</span></div>
  <div class="status">DTok • Exact visual prototype • DEMO COINS</div>
</div>

<script>
const symbols=["♦️","♦️","🦄","⚡","💎","🏛️","🔱","🪖","🍷","⭐","W"];
let balance=8750,bet=100,spinning=false,auto=false;

const area=document.getElementById("reelArea");
const result=document.getElementById("result");
const balanceEl=document.getElementById("balance");
const win=document.getElementById("win");

function makeReel(){
  const reel=document.createElement("div");
  reel.className="reel";
  const strip=document.createElement("div");
  strip.className="strip";
  for(let i=0;i<15;i++){
    const s=document.createElement("div");
    const v=symbols[Math.floor(Math.random()*symbols.length)];
    s.className="sym"+(v==="W"?" wild":"");
    s.textContent=v;
    strip.appendChild(s);
  }
  reel.appendChild(strip);return reel;
}
function build(){
  area.innerHTML="";
  for(let i=0;i<5;i++)area.appendChild(makeReel());
  size();
}
function size(){
  document.querySelectorAll(".reel").forEach(r=>{
    const h=r.clientHeight;
    [...r.querySelectorAll(".sym")].forEach(s=>s.style.height=(h/3-3)+"px");
  });
}
window.addEventListener("resize",size);

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function finalBoard(){
  const vals=["🦄","🦄","🦄","🦄","🦄"];
  document.querySelectorAll(".reel").forEach((r,c)=>{
    const strip=r.querySelector(".strip");
    const arr=[...strip.children];
    for(let i=0;i<arr.length;i++)arr[i].textContent=symbols[Math.floor(Math.random()*symbols.length)];
    arr[5].textContent=vals[c];
    arr[6].textContent=symbols[Math.floor(Math.random()*symbols.length)];
    arr[7].textContent=symbols[Math.floor(Math.random()*symbols.length)];
  });
}
async function spin(){
  if(spinning)return;
  if(balance<bet)return;
  spinning=true;balance-=bet;update();
  const reels=[...document.querySelectorAll(".reel")];
  reels.forEach(r=>r.classList.add("rolling"));
  await Promise.all(reels.map((r,i)=>new Promise(resolve=>{
    const strip=r.querySelector(".strip");
    const h=r.clientHeight;
    const target=-(5*(h/3));
    strip.style.transition=`transform ${720+i*170}ms cubic-bezier(.08,.75,.16,1)`;
    strip.style.transform=`translateY(${target}px)`;
    setTimeout(()=>{r.classList.remove("rolling");r.classList.add("win");resolve()},760+i*170);
  })));
  finalBoard();
  await sleep(120);
  reels.forEach(r=>r.classList.remove("win"));
  const payout=bet*12;
  balance+=payout;result.textContent=payout.toLocaleString("ru-RU");
  win.querySelector("strong").textContent="+"+payout.toLocaleString("ru-RU");
  win.classList.remove("show");void win.offsetWidth;win.classList.add("show");
  update();spinning=false;
  if(auto)setTimeout(spin,650);
}
function update(){balanceEl.textContent=balance.toLocaleString("ru-RU")}
document.querySelector(".spin").onclick=spin;
document.querySelector(".betminus").onclick=()=>{bet=Math.max(10,bet-10)};
document.querySelector(".betplus").onclick=()=>{bet=Math.min(1000,bet+10)};
document.querySelector(".autoplay").onclick=()=>{auto=!auto;if(auto&&!spinning)spin()};
build();update();
</script>
</body>
</html>
